# Prueft Formatierung, Syntax und das Verhalten des OpenTofu-Codes (fmt,
# validate, test mit gemockten Providern). Kein plan/apply: das Ausrollen
# uebernimmt der App-Store-Worker.
#
# tflint und tfsec laufen nicht mehr mit: beide lesen nur *.tf und finden in
# tofu/ keine Datei.

name: 'OpenTofu'

on:
  push:
  pull_request:
    branches: [ "main" ]
  release:
    types: [created]

permissions:
  contents: read

jobs:
  opentofu:
    name: 'OpenTofu'
    runs-on: ubuntu-latest
    environment: production

    defaults:
      run:
        shell: bash
        working-directory: tofu

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    # Gleiche Version wie im App-Store-Worker
    - name: Setup OpenTofu
      uses: opentofu/setup-opentofu@v2
      with:
        tofu_version: 1.13.1
        tofu_wrapper: false

    - name: OpenTofu Init
      run: tofu init -backend=false

    - name: OpenTofu Format
      run: tofu fmt -check -recursive

    - name: OpenTofu Validate
      run: tofu validate

    - name: OpenTofu Test
      run: tofu test
